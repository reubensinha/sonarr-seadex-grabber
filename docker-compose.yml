version: '3.8'

services:
  sonarr-seadex-grabber:
    image: ghcr.io/reubensinha/sonarr-seadex-grabber:latest
    container_name: sonarr-seadex-grabber
    restart: unless-stopped
    
    # Environment variables for configuration - values are substituted from
    # a .env file (copy .env.docker to .env and fill it in) via Docker
    # Compose's ${VAR} interpolation.
    environment:
      # Sonarr configuration
      - SONARR_URL=${SONARR_URL:-http://sonarr:8989}
      - SONARR_API_KEY=${SONARR_API_KEY}
      - SONARR_SERIES_TYPE=${SONARR_SERIES_TYPE:-}
      - SONARR_TAGS=${SONARR_TAGS:-}  # Comma-separated list of tags

      # qBittorrent configuration
      - QB_URL=${QB_URL:-http://qbittorrent:8080}
      - QB_USER=${QB_USER}
      - QB_PASS=${QB_PASS}
      - QB_CATEGORY=${QB_CATEGORY:-anime-sonarr}

      # Web UI / webhook server configuration - the dashboard is always
      # reachable on this port; USE_WEBHOOK only controls whether incoming
      # Sonarr webhook events trigger a sync
      - WEBHOOK_HOST=0.0.0.0
      - WEBHOOK_PORT=8765
      - USE_WEBHOOK=${USE_WEBHOOK:-false}  # Set to true to act on Sonarr webhook events

      # Optional: Additional configuration
      - STARTUP_SCAN=${STARTUP_SCAN:-false}
      - SYNC_INTERVAL=${SYNC_INTERVAL:-86400}
    
    # Port mapping for the dashboard/webhook server
    ports:
      - "8765:8765"
    
    # Persistent data volume
    volumes:
      - ./data:/app/data
    
    # Health check
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8765/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
    # Network configuration
    networks:
      - sonarr-network

# Optional: Create a custom network for better service communication
networks:
  sonarr-network:
    driver: bridge

# Optional: Named volumes for persistent data
volumes:
  sonarr-seadex-data:
    driver: local
