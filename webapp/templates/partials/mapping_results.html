{% if not query %}
{% elif not results %}
<p class="muted">No AniList results for "{{ query }}".</p>
{% else %}
<ul class="mapping-result-list">
  {% for r in results %}
  <li>
    <span>{{ r.title }} ({{ r.season_year if r.season_year else '—' }}) &middot; AniList {{ r.anilist_id }}</span>
    <button type="button" hx-post="/series/{{ sonarr_id }}/mapping" hx-vals='{"anilist_id": "{{ r.anilist_id }}"}' hx-target="closest .card" hx-swap="outerHTML">Add</button>
  </li>
  {% endfor %}
</ul>
{% endif %}
